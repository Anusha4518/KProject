# Military Asset Management Backend Configuration
spring.application.name=military-asset-management

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration (H2 In-Memory Default for Zero-Config Render Cloud Hosting)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:kproject_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,VALUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Seed Data Settings
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# JWT Security Configuration
jwt.secret=${JWT_SECRET:9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f}
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.military.assetmanagement=DEBUG
