# Military Asset Management Backend Configuration
spring.application.name=military-asset-management

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration (Port 3309)
spring.datasource.url=jdbc:mysql://localhost:3309/kproject_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Anusha@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization Settings
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# JWT Security Configuration
jwt.secret=9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.military.assetmanagement=DEBUG
